<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <base href="/app/">
  <title>Venstogram</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23ec4899'/><stop offset='50%' stop-color='%23f43f5e'/><stop offset='100%' stop-color='%23f59e0b'/></linearGradient></defs><rect width='100' height='100' rx='25' fill='url(%23g)'/><text x='50%' y='68%' font-size='60' font-weight='900' font-family='sans-serif' fill='%23ffffff' text-anchor='middle'>V</text></svg>">
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      try {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      } catch (e) {}
    }
  </script>

  <!-- Global Error Handler to eliminate white screen -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error("[Window Error]", msg, url, line, col, error);
      var errEl = document.getElementById("debug-error");
      if (errEl) {
        errEl.style.display = "block";
        errEl.innerHTML = "<div style='background:#ffffff;border:1px solid #f43f5e;border-radius:16px;padding:24px;margin:40px auto;max-width:340px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);'>" +
          "<div style='font-size:36px;margin-bottom:12px;'>⚠️</div>" +
          "<h3 style='color:#0f172a;font-size:16px;font-weight:bold;margin:0 0 8px;'>Ошибка запуска платформы</h3>" +
          "<p style='color:#e11d48;font-size:12px;margin:0 0 16px;line-height:1.4;word-break:break-word;'>" + (msg || "Не удалось загрузить скрипт") + "</p>" +
          "<button onclick='try{localStorage.clear();}catch(e){}location.reload(true);' style='background:linear-gradient(135deg,#ec4899,#f43f5e);color:#fff;font-weight:bold;font-size:13px;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px rgba(236,72,153,0.4);'>🔄 Перезагрузить</button>" +
          "</div>";
      }
      return false;
    };
  </script>

  <!-- Local Tailwind CSS -->
  <script src="./tailwind.min.js"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              vensto: {
                pink: '#ec4899',
                rose: '#f43f5e',
                amber: '#f59e0b'
              }
            }
          }
        }
      };
    }
  </script>

  <!-- React 18 & ReactDOM Standalone -->
  <script src="./react.min.js"></script>
  <script src="./react-dom.min.js"></script>

  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Telegram safe area padding */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 18px);
    }
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #ffffff;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-900 min-h-screen">
  <div id="root">
    <!-- Immediate visual splash screen prevents white flash on initial load -->
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:#ffffff;text-align:center;">
      <div style="width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#ec4899,#f43f5e,#f59e0b);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:900;margin:0 auto 16px;box-shadow:0 12px 28px rgba(236,72,153,0.3);">
        V
      </div>
      <div style="font-size:18px;font-weight:900;color:#0f172a;letter-spacing:1px;margin-bottom:6px;">VENSTOGRAM</div>
      <div style="font-size:12px;color:#ec4899;font-weight:600;letter-spacing:0.5px;">Загрузка платформы...</div>
    </div>
  </div>
  <div id="debug-error" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;color:#ef4444;padding:20px;z-index:99999;font-family:sans-serif;overflow:auto;"></div>

  <!-- Compiled Standalone Bundle with cache busting -->
  <script src="./app.bundle.js?v=20261125_20"></script>
</body>
</html>
